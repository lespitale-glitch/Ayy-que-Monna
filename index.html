<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFF8F3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ayy Que Monna — bijouterie" />
    <title>Ayy Que Monna</title>
    <!-- Colores de marca elegidos en /admin/ajustes (guardados en la visita anterior, utils/theme.js).
         Va en línea y antes de la app para que los botones no "parpadeen" con los colores viejos. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('monna-theme')) || {}
        var ok = /^#[0-9A-F]{6}$/
        for (var name in t) {
          if (name.indexOf('--brand-') === 0 && ok.test(t[name])) document.documentElement.style.setProperty(name, t[name])
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
